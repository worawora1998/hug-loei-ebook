if(page==="gallery"){lightItems=cat.key==="poster"?(group.poster||[]).slice((set-1)*10,set*10):(group[cat.key]||[]);document.querySelectorAll("[data-idx]").forEach(b=>b.addEventListener("click",()=>openLight(Number(b.dataset.idx))))}
function openLight(i){if(!lightItems.length)return;lightIndex=(i+lightItems.length)%lightItems.length;lbImg.src=thumb(lightItems[lightIndex].id,2200);lbImg.dataset.file=lightItems[lightIndex].id;lbImg.dataset.step=0;lb.classList.add("open");document.body.style.overflow="hidden";document.getElementById("lbPrev").style.display=lightItems.length>1?"flex":"none";document.getElementById("lbNext").style.display=lightItems.length>1?"flex":"none"}
function closeLight(){lb.classList.remove("open");document.body.style.overflow=""}
document.getElementById("lbClose").addEventListener("click",closeLight);document.getElementById("lbPrev").addEventListener("click",()=>openLight(lightIndex-1));document.getElementById("lbNext").addEventListener("click",()=>openLight(lightIndex+1));lb.addEventListener("click",e=>{if(e.target===lb)closeLight()});lbImg.addEventListener("error",()=>fallback(lbImg));document.addEventListener("keydown",e=>{if(!lb.classList.contains("open"))return;if(e.key==="Escape")closeLight();if(e.key==="ArrowRight")openLight(lightIndex+1);if(e.key==="ArrowLeft")openLight(lightIndex-1)});
